spring.application.name=kanban-backend

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


app.auth.access-ttl=${JWT_ACCESS_EXPIRATION:15m}
app.auth.refresh-ttl=${JWT_REFRESH_EXPIRATION:7d}
app.auth.session-retention=${AUTH_SESSION_RETENTION:7d}
app.auth.cleanup-interval=${AUTH_CLEANUP_INTERVAL:1h}
app.auth.cleanup-batch-size=${AUTH_CLEANUP_BATCH_SIZE:500}
app.auth.issuer=${JWT_ISSUER:kanban-backend}
app.auth.audience=${JWT_AUDIENCE:kanban-api}
app.auth.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}
app.auth.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
app.auth.clock-skew=${JWT_CLOCK_SKEW:30s}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:true}
app.auth.bcrypt-strength=${BCRYPT_STRENGTH:12}
app.auth.rate-limit.register-attempts=${AUTH_RATE_LIMIT_REGISTER_ATTEMPTS:5}
app.auth.rate-limit.register-window=${AUTH_RATE_LIMIT_REGISTER_WINDOW:1h}
app.auth.rate-limit.login-ip-attempts=${AUTH_RATE_LIMIT_LOGIN_IP_ATTEMPTS:30}
app.auth.rate-limit.login-email-attempts=${AUTH_RATE_LIMIT_LOGIN_EMAIL_ATTEMPTS:10}
app.auth.rate-limit.login-window=${AUTH_RATE_LIMIT_LOGIN_WINDOW:15m}
app.auth.rate-limit.refresh-attempts=${AUTH_RATE_LIMIT_REFRESH_ATTEMPTS:120}
app.auth.rate-limit.refresh-window=${AUTH_RATE_LIMIT_REFRESH_WINDOW:1m}
app.auth.rate-limit.max-entries=${AUTH_RATE_LIMIT_MAX_ENTRIES:10000}

# Until a trusted reverse proxy is configured, use the actual connection address for rate limits.
server.forward-headers-strategy=none

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
